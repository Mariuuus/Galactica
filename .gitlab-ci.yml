# thanks to https://medium.com/@mojtabashirkhani.nba/setting-up-gitlab-ci-cd-for-an-android-project-a-step-by-step-guide-b3c5886084de

stages:
  - build
  - test

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

default:
  image: eclipse-temurin:17-jdk
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
      - android-sdk
  before_script:
    - apt-get update -y
    - apt-get install -y wget unzip
    - export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
    - export PATH="$JAVA_HOME/bin:$PATH"
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
    - unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
    - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
    - yes | sdkmanager --licenses >/dev/null || true
    - sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
    - chmod +x ./gradlew

build:
  stage: build
  script:
    - ./gradlew --no-daemon assembleDebug
  artifacts:
    expire_in: 1 week
    paths:
      - app/build/outputs/

test:
  stage: test
  script:
    - ./gradlew --no-daemon testDebugUnitTest
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - app/build/reports/tests/
      - app/build/test-results/
